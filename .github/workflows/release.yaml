name: "Release Dev Container Features"

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: "Publish Features"
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Save features collection"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TOKEN_B64=$(echo -n "${{ github.actor }}:${GITHUB_TOKEN}" | base64 -w 0)
          BEARER=$(curl -sf \
            "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/devcontainer-features:pull&service=ghcr.io" \
            -H "Authorization: Basic ${TOKEN_B64}" | jq -r .token)
          MANIFEST=$(curl -sf \
            -H "Authorization: Bearer ${BEARER}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/devcontainer-features/manifests/latest")
          DIGEST=$(echo "${MANIFEST}" | jq -r '.layers[0].digest')
          curl -sfL \
            -H "Authorization: Bearer ${BEARER}" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/devcontainer-features/blobs/${DIGEST}" \
            -o /tmp/features-collection.json
          echo "Saved features collection:"
          cat /tmp/features-collection.json

      - name: "Publish Templates"
        uses: devcontainers/action@v1
        with:
          publish-templates: "true"
          base-path-to-templates: "./templates"
          generate-docs: "true"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Merge and republish combined collection"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Download the templates collection (just published, currently at :latest)
          TOKEN_B64=$(echo -n "${{ github.actor }}:${GITHUB_TOKEN}" | base64 -w 0)
          BEARER=$(curl -sf \
            "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/devcontainer-features:pull&service=ghcr.io" \
            -H "Authorization: Basic ${TOKEN_B64}" | jq -r .token)
          MANIFEST=$(curl -sf \
            -H "Authorization: Bearer ${BEARER}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/devcontainer-features/manifests/latest")
          DIGEST=$(echo "${MANIFEST}" | jq -r '.layers[0].digest')
          curl -sfL \
            -H "Authorization: Bearer ${BEARER}" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/devcontainer-features/blobs/${DIGEST}" \
            -o /tmp/templates-collection.json

          # Merge features and templates into a single collection
          jq -s '{
            sourceInformation: .[0].sourceInformation,
            features: (.[0].features // []),
            templates: (.[1].templates // [])
          }' /tmp/features-collection.json /tmp/templates-collection.json \
            > devcontainer-collection.json

          echo "Combined collection:"
          cat devcontainer-collection.json

          # Install oras (OCI Registry As Storage CLI)
          ORAS_VERSION=1.2.0
          curl -sfLO "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          tar -xzf "oras_${ORAS_VERSION}_linux_amd64.tar.gz" oras

          # Push the combined collection back to the registry
          echo "${GITHUB_TOKEN}" | ./oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          echo -n '{}' > /tmp/devcontainer-config.json
          ./oras push \
            "ghcr.io/${{ github.repository_owner }}/devcontainer-features:latest" \
            --config "/tmp/devcontainer-config.json:application/vnd.devcontainers" \
            "devcontainer-collection.json:application/vnd.devcontainers.collection.layer.v1+json" \
            --annotation "com.github.package.type=devcontainer_collection"

          echo "Combined collection published successfully"

      # Push documentation updates to master
      - name: Push docs to master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Start."

          # Create new branch for documentation updates
          branch=automated-documentation-update-$GITHUB_RUN_ID
          echo "Creating branch: $branch"

          # Create branch via API (this will be automatically signed)
          gh api \
            --method POST \
            /repos/$GITHUB_REPOSITORY/git/refs \
            -f ref="refs/heads/$branch" \
            -f sha="$GITHUB_SHA"

          message='Automated documentation update [skip ci]'

          # Find all README.md files in feature directories
          readmes=$(find ./src -name "README.md" || true)

          # Check if any README files were found
          if [ -z "$readmes" ]; then
            echo "No README files found to update"
            exit 0
          fi

          # Commit each README file via GitHub API (automatically signed)
          for readme in $readmes; do
            file_path=${readme#./}  # Remove leading ./
            echo "Processing $file_path"

            # Try to get file SHA from the new branch; empty if file doesn't exist yet
            file_sha=$(gh api \
              --method GET \
              "/repos/$GITHUB_REPOSITORY/contents/$file_path?ref=$branch" \
              -q '.sha' 2>/dev/null || echo "")

            if [ -n "$file_sha" ]; then
              echo "Updating existing file: $file_path"
              gh api \
                --method PUT \
                "/repos/$GITHUB_REPOSITORY/contents/$file_path" \
                -f message="$message" \
                -f content="$(base64 -i "$readme")" \
                -f sha="$file_sha" \
                -f branch="$branch" \
                || echo "No changes to commit for $file_path"
            else
              echo "Creating new file: $file_path"
              gh api \
                --method PUT \
                "/repos/$GITHUB_REPOSITORY/contents/$file_path" \
                -f message="$message" \
                -f content="$(base64 -i "$readme")" \
                -f branch="$branch" \
                || echo "Failed to create $file_path"
            fi
          done

          # Create PR
          gh pr create --title "$message" --body "$message" --head "$branch" --base "master" \
            || echo "No changes to create PR for"
